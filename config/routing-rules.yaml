# routing-rules.yaml — 위임 조건 선언 (사용자 커스터마이즈 지점)
#
# 이 파일이 없으면 위임은 전면 비활성화된다 (안전 기본값).
# 파싱 실패 시에도 위임은 중단된다.

backend: codex

codex:
  command: codex
  # headless_args: 설치 후 `codex --help`로 확인하여 맞는 것을 사용하세요.
  # 후보 옵션 (주석 해제해서 사용):
  #   ["--quiet"]            # 진행 메시지 억제 (가장 일반적)
  #   ["--no-interactive"]   # 대화형 입력 비활성화
  #   []                     # 플래그 없이 stdin만으로 동작하는 경우
  headless_args: []

delegate_if:
  task_type:
    - boilerplate
    - test-stub
    - docstring
    - format-transform
    - classification
  max_files_touched: 2
  spec_change: false
  # 검증 수단이 하나라도 있어야만 위임한다
  verification:
    - tests-exist
    - diff-only

never_delegate:
  - security-sensitive      # 인증/암호화/입력검증 코드
  - architecture-change
  - cross-module-refactor

limits:
  timeout_sec: 180
  max_retries: 1
  max_output_lines: 500
