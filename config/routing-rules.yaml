# routing-rules.yaml — 위임 조건 선언 (사용자 커스터마이즈 지점)
#
# 이 파일이 없으면 위임은 전면 비활성화된다 (안전 기본값).
# 파싱 실패 시에도 위임은 중단된다.

backend: cline

cline:
  command: cline
  # Q2(SPEC §9): cline 버전별로 헤드리스 플래그가 다를 수 있다.
  # 기본값은 stdin으로 프롬프트를 받는 비대화형 실행을 가정한다.
  # Phase 2에서 실제 cline CLI 버전 확인 후 확정한다.
  # 예) ["task", "--non-interactive"] / 구버전 ["--headless"]
  headless_args: ["task", "--non-interactive"]

delegate_if:
  task_type:
    - boilerplate
    - test-stub
    - docstring
    - format-transform
    - classification
  max_files_touched: 2
  spec_change: false
  # 검증 수단이 하나라도 있어야만 위임한다
  verification:
    - tests-exist
    - diff-only

never_delegate:
  - security-sensitive      # 인증/암호화/입력검증 코드
  - architecture-change
  - cross-module-refactor

limits:
  timeout_sec: 180
  max_retries: 1
  max_output_lines: 500
